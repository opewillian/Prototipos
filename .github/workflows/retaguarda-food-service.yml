name: Retaguarda Food Service - validar

on:
  push:
    paths:
      - 'retaguarda-food-service/**'
      - '.github/workflows/retaguarda-food-service.yml'
  pull_request:
    paths:
      - 'retaguarda-food-service/**'
      - '.github/workflows/retaguarda-food-service.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar e construir
        working-directory: retaguarda-food-service
        run: npm run build
      - name: Conferir arquivos estáticos
        run: test -f retaguarda-food-service/dist/index.html && test -f retaguarda-food-service/dist/src/main.js
